<!doctype html><meta charset="utf-8"><title>Message DOM regression</title>
<style>body{font:16px sans-serif;margin:24px}.pass{color:green}.fail{color:red}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden}button{margin:4px}</style>
<h1>Message DOM regression</h1><p>Synthetic content only. Chrome transport is intercepted; no Share, generation or Vault writes.</p><div id="results"></div><main></main>
<script type="module">
const root=document.querySelector('main'), results=document.querySelector('#results');
const locationMock={href:'https://chatgpt.com/c/synthetic-dom-regression'};
const messages=[], alerts=[];let failures=0,checks=0;
globalThis.chrome={runtime:{id:'synthetic-extension',sendMessage(msg,cb){messages.push(msg);cb({ok:true,pong:true});}},storage:{sync:{get(_k,cb){setTimeout(()=>cb({uiLanguage:'en'}),0);}},local:{get(_k,cb){cb({htmlSaveDirMigratedFromSync:true});}},onChanged:{addListener(){}}}};
globalThis.alert=t=>alerts.push(t);globalThis.__GPT_OBSIDIAN_ENABLE_TEST_HOOKS__=true;
for(const file of ['branch-visualize.js','content.js'])new Function('location',await(await fetch('../'+file,{cache:'no-store'})).text())(locationMock);
const h=globalThis.__GPT_OBSIDIAN_TEST_HOOKS__;
const tick=()=>new Promise(r=>setTimeout(r,50));
function check(name,ok,detail=''){checks++;const n=document.createElement('p');n.className=ok?'pass':'fail';n.textContent=(ok?'PASS ':'FAIL ')+name+(detail?' — '+detail:'');results.append(n);if(!ok)failures++;}
function assert(ok,msg){if(!ok)throw Error(msg);}
function unit(role,id,text){const key=`synthetic-${id}:0:${role}`;const n=document.createElement('div');n.setAttribute('data-chatgpt-search-unit-key',key);n.setAttribute('data-chatgpt-search-message-ids',`${id} ${id}`);
if(role==='assistant'){n.setAttribute('data-content-search-unit-key',key);n.innerHTML=`<h4 class="sr-only" data-conversation-role="assistant" tabindex="-1">ChatGPT 답변:</h4><div class="markdown"><p>${text}</p></div>`;}
else{n.className='group/user-message';n.innerHTML=`<div data-content-search-unit-key="${key}"><div class="group/user-message"><p>${text}</p></div><button aria-label="프롬프트 공유">Prompt share</button></div>`;}
return n;}
function wrap(...units){const g=document.createElement('div'), body=document.createElement('div'), toolbar=document.createElement('div');body.append(...units);toolbar.className='turn-action-controls';toolbar.innerHTML='<button data-testid="pin-message-turn-action-button" data-message-id="synthetic-pin" aria-label="메시지 고정">Pin</button><button aria-label="복사">Copy</button><button aria-label="공유">Share</button>';g.append(body,toolbar);root.append(g);return toolbar;}
function old(role,id,text){const a=document.createElement('article');a.setAttribute('data-testid','conversation-turn-'+id);a.setAttribute('data-turn-id',id);a.setAttribute('data-turn',role);a.innerHTML=`<div data-message-author-role="${role}" data-message-id="${id}"><p>${text}</p></div>`;root.append(a);return a.firstElementChild;}
async function test(name,fn){root.replaceChildren();messages.length=0;alerts.length=0;try{await fn();check(name,true);}catch(e){check(name,false,e.message);}finally{locationMock.href="https://chatgpt.com/c/synthetic-dom-regression";}}
const ids=['11111111-2222-4333-8444-555555555555','22222222-2222-4333-8444-555555555555','33333333-2222-4333-8444-555555555555'];
await test('new DOM injects one Save and Branch per assistant, none on user',async()=>{const q=unit('user',ids[0],'Question ONE?'),a=unit('assistant',ids[1],'Answer ONE.'),b=unit('assistant',ids[2],'Answer TWO.');wrap(q,a);wrap(b);await tick();assert(root.querySelectorAll('.gpt2obs-btn').length===2,'expected 2 Save buttons');assert(!q.querySelector('.gpt2obs-btn'),'user got Save');assert(root.querySelectorAll('.gpt2obs-visualize-btn').length===2,'missing adjacent Branch');});
await test('selected answer keeps nearest Q and provenance-only earlier assistant',async()=>{const q=unit('user',ids[0],'Question ONE?'),a=unit('assistant',ids[1],'Answer ONE.'),b=unit('assistant',ids[2],'Answer TWO.');wrap(q,a);wrap(b);await tick();const p=h.captureSupplementalShareTargetProof(b);assert(p.ok,p.reason);assert(p.proof.questionNode===q,'wrong question');assert(p.proof.interveningAssistants.length===1,'missing A1 provenance');const md=h.htmlToMarkdown(h.extractAssistantMessageHTML(b.querySelector('.gpt2obs-btn')));assert(md.includes('Answer TWO.')&&!md.includes('Answer ONE.')&&!md.includes('ChatGPT 답변:')&&!md.includes('visualize'),'answer leaked UI/other response');assert(h.questionNodeToPlainText(q)==='Question ONE?','question leaked toolbar');});
await test('response Share selects only outer response toolbar, excludes prompt/body lookalikes',async()=>{const q=unit('user',ids[0],'Question?'),a=unit('assistant',ids[1],'Answer.');const t=wrap(q,a);a.querySelector('.markdown').insertAdjacentHTML('beforeend','<div class="turn-action-controls response-actions" role="toolbar"><button aria-label="공유">Share body demo</button></div>');await tick();const s=h.resolveResponseShareTrigger(a);assert(s.status==='found',s.reason);assert(s.control===t.lastElementChild,'selected non-response Share');});
await test('duplicate response Share controls fail closed',async()=>{const a=unit('assistant',ids[1],'Answer.');const t=wrap(a);t.append(t.lastElementChild.cloneNode(true));await tick();assert(h.resolveResponseShareTrigger(a).status==='ambiguous','ambiguous Share accepted');});
await test('legacy layout still injects and extracts',async()=>{old('user','synthetic-q','Legacy question?');const a=old('assistant','synthetic-a','Legacy answer.');await tick();assert(a.querySelector('.gpt2obs-btn'),'legacy Save missing');assert(h.captureSupplementalShareTargetProof(a).ok,'legacy proof failed');});
await test('mixed layouts preserve chronology and nearest question',async()=>{old('user','synthetic-old-q','Old question?');old('assistant','synthetic-old-a','Old answer.');const q=unit('user',ids[0],'New question?'),a=unit('assistant',ids[1],'New answer.');wrap(q,a);await tick();const p=h.captureSupplementalShareTargetProof(a);assert(p.ok&&p.proof.questionNode===q,'mixed ordering lost');});
await test('role marker/key disagreement never receives Save',async()=>{const a=unit('assistant',ids[1],'Wrong role.');a.querySelector('h4').setAttribute('data-conversation-role','user');wrap(a);await tick();assert(!a.querySelector('.gpt2obs-btn'),'conflicting role accepted');});
await test('multiple native message IDs never receive Save',async()=>{const a=unit('assistant',ids[1],'Multiple identities.');a.setAttribute('data-chatgpt-search-message-ids',ids[1]+' '+ids[2]);wrap(a);await tick();assert(!a.querySelector('.gpt2obs-btn'),'multiple IDs accepted');});
await test('nested search unit is ambiguous, not two independent messages',async()=>{const a=unit('assistant',ids[1],'Outer.');a.append(unit('assistant',ids[2],'Nested.'));wrap(a);await tick();assert(!a.querySelector('.gpt2obs-btn'),'nested units accepted');});
await test('duplicate native ID invalidates Share proof',async()=>{const q=unit('user',ids[0],'Question?'),a=unit('assistant',ids[1],'Answer.');wrap(q,a);wrap(unit('assistant',ids[1],'Duplicate.'));await tick();assert(!h.captureSupplementalShareTargetProof(a).ok,'duplicate ID accepted');});
await test('role and message ID drift invalidate frozen proof',async()=>{const q=unit('user',ids[0],'Question?'),a=unit('assistant',ids[1],'Answer.');wrap(q,a);await tick();const p=h.captureSupplementalShareTargetProof(a);assert(p.ok,p.reason);a.setAttribute('data-chatgpt-search-message-ids',ids[2]);assert(!h.revalidateSupplementalShareTargetProof(p.proof).ok,'ID drift accepted');a.setAttribute('data-chatgpt-search-message-ids',ids[1]);a.querySelector('h4').setAttribute('data-conversation-role','user');assert(!h.revalidateSupplementalShareTargetProof(p.proof).ok,'role drift accepted');});
await test('attribute-only completion injects once without duplicate buttons',async()=>{const a=unit('assistant',ids[1],'Late metadata.');const key=a.getAttribute('data-chatgpt-search-unit-key');a.removeAttribute('data-chatgpt-search-unit-key');wrap(a);await tick();a.setAttribute('data-chatgpt-search-unit-key',key);await tick();await tick();assert(a.querySelectorAll('.gpt2obs-btn').length===1,'late metadata not recognized');});
await test('project save pipeline emits URI with Q + selected A only',async()=>{locationMock.href='https://chatgpt.com/g/g-p-'+ 'a'.repeat(32)+'/c/'+ids[0];const q=unit('user',ids[0],'Pipeline question?'),a=unit('assistant',ids[1],'Earlier answer.'),b=unit('assistant',ids[2],'Selected answer.');wrap(q,a);wrap(b);await tick();let uri='';const status=await h.handleCopyClick(b.querySelector('.gpt2obs-btn'),{delayMs:0,openObsidianURIFn:u=>{uri=u;},alertFn:t=>alerts.push(t)});assert(status?.ok,JSON.stringify(status||alerts));const md=new URL(uri).searchParams.get('content');assert(md.includes('Pipeline question?')&&md.includes('Selected answer.')&&!md.includes('Earlier answer.')&&!md.includes('ChatGPT 답변:'),'wrong Markdown');assert(!messages.some(m=>/clipboard|share/.test(m.type)),'unexpected sharing');locationMock.href='https://chatgpt.com/c/synthetic-dom-regression';});
await test('ordinary Save cancellation stops before Share or note effects',async()=>{const q=unit('user',ids[0],'Cancel question?'),a=unit('assistant',ids[1],'Cancel answer.');wrap(q,a);await tick();let consents=0,writes=0;const status=await h.handleCopyClick(a.querySelector('.gpt2obs-btn'),{delayMs:0,requestShareConsentFn:async()=>{consents++;return false;},openObsidianURIFn:()=>writes++,alertFn:t=>alerts.push(t)});assert(consents===1,'never reached valid response consent: '+JSON.stringify(status));assert(writes===0&&!messages.some(m=>/clipboard/.test(m.type)),'effect after cancellation');});
await test('merged earlier assistant is provenance only, never selected or remounted',async()=>{const q=unit('user',ids[0],'Question?'),prior=unit('assistant','44444444-2222-4333-8444-555555555555','Earlier merged answers.'),a=unit('assistant',ids[1],'Selected answer.');prior.setAttribute('data-chatgpt-search-message-ids','44444444-2222-4333-8444-555555555555 55555555-2222-4333-8444-555555555555');wrap(q,prior);wrap(a);await tick();const p=h.captureSupplementalShareTargetProof(a);assert(p.ok,p.reason);assert(!h.captureSupplementalShareTargetProof(prior).ok,'merged selected target accepted');assert(p.proof.interveningAssistants.length===1,'missing merged provenance');assert(h.revalidateSupplementalShareTargetProof(p.proof).ok,'unchanged merged provenance failed');prior.setAttribute('data-chatgpt-search-message-ids','44444444-2222-4333-8444-555555555555 66666666-2222-4333-8444-555555555555');assert(!h.revalidateSupplementalShareTargetProof(p.proof).ok,'merged identity drift accepted');prior.setAttribute('data-chatgpt-search-message-ids','44444444-2222-4333-8444-555555555555 55555555-2222-4333-8444-555555555555');prior.replaceWith(prior.cloneNode(true));assert(!h.revalidateSupplementalShareTargetProof(p.proof).ok,'merged remount accepted');});
await test('Branch uses selected native message ID without creating a real branch',async()=>{locationMock.href='https://chatgpt.com/c/'+ids[0];const a=unit('assistant',ids[1],'Branch answer.');wrap(a);await tick();a.querySelector('.gpt2obs-visualize-btn').click();await tick();await tick();const start=messages.find(m=>m.type.endsWith('-start'));assert(start?.messageId===ids[1],'branch lost native identity');locationMock.href='https://chatgpt.com/c/synthetic-dom-regression';});
document.title=`${failures?'FAIL':'PASS'} ${checks-failures}/${checks} Message DOM regression`;
results.dataset.done='true';results.dataset.failures=failures;
</script>
