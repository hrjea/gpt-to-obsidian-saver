name: Bug report
description: Report a reproducible problem with GPT to Obsidian Saver.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "1.5.40"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: GitHub Release package version
      placeholder: "v1.5.40"
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version, if relevant
  - type: dropdown
    id: mode
    attributes:
      label: Save mode
      options:
        - Obsidian URI mode
        - Native-helper local file/artifact mode
        - Response-scoped remote-reference mode
        - Whole-conversation remote-reference fallback
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sanitized, minimal steps. Do not paste private ChatGPT conversations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: failure-stage
    attributes:
      label: Exact failure stage and sanitized reason, if shown
      description: Examples include preflight, share-button, share-dialog, share-url, native-save, or runtime. Do not paste a private URL.
  - type: textarea
    id: side-effects
    attributes:
      label: Observed side effects and Vault result
      description: State whether Share/Create/Update/copy, URI, or Native save ran, and whether an actual note/attachment appeared. Do not include real paths or content.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove private paths, extension IDs, vault names, tokens, credentials, ChatGPT conversation/share URLs, and private content.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private ChatGPT content and URLs, vault data, credentials, tokens, private paths, and private extension IDs.
          required: true
